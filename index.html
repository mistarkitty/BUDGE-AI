<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDGE AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">B</div>

            <div>
                <div class="brand-name">BUDGE AI</div>
                <div class="brand-subtitle">Artificial Intelligence</div>
            </div>

        </div>

        <nav>

            <a href="#" class="nav-button active">Chat</a>
            <a href="#" class="nav-button">About</a>
            <a href="#" class="nav-button">Settings</a>

        </nav>

    </header>


    <main class="app">

      <aside class="sidebar panel">

    <button class="button new-chat">
        + New Chat
    </button>

    <div class="sidebar-title">
        CHAT HISTORY
    </div>

    <div class="chat-list">

        <button class="chat-item selected">
            <span class="chat-icon">▸</span>
            Untitled Chat
        </button>

    </div>

    <div class="sidebar-bottom">

        <div class="status-box">

            <span class="status-dot"></span>

            SERVERS ARE CURRENTLY OFFLINE - REASON : AI DOESNT EVEN EXIST YET BRO

        </div>

    </div>

</aside>


        <section class="chat panel">

            <div class="chat-header">

                <div>

                    <div class="chat-title">
                        BUDGE AI
                    </div>

                    <div class="chat-status">
                        Your AI Chatbot who has the answers to your questions about me and my studio!
                    </div>

                </div>

                <button class="small-button">
                    Clear
                </button>

            </div>


            <div class="messages">
            </div>


            <div class="input-area">

                <textarea
                    id="messageInput"
                    placeholder="Type a message..."
                    rows="3"
                ></textarea>

                <div class="input-footer">

                    <div class="input-info">
                        ENTER TO SEND
                    </div>

                    <button class="button send-button">
                        SEND
                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <span>BUDGE AI</span>
        <span>v0.1.0</span>
        <span>© 2026 BUDGE AI</span>

    </footer>


    <script src="script.js"></script>

</body>

</html>
